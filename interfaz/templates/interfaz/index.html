{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>HydroGuard Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'interfaz/styles.css' %}">
</head>
<body>
  <div class="scene">
    <div class="sky"></div>
    <div class="clouds-back"></div>
    <div class="mist"></div>
    <div class="mountains-back"></div>
    <div class="mountains-front"></div>
    <div class="clouds-front"></div>
    <div class="ground"></div>
    <div class="grass-overlay"></div>

    <!-- Charcos -->
    <div class="charco" style="left: 15%; width: 130px; height: 45px;"></div>
    <div class="charco" style="left: 40%; width: 90px; height: 35px; animation-delay: 0.5s;"></div>
    <div class="charco" style="left: 65%; width: 110px; height: 40px; animation-delay: 1s;"></div>
    <div class="charco" style="left: 80%; width: 70px; height: 30px; animation-delay: 1.5s;"></div>

    <!-- Lluvia -->
    <div id="rain-layer"></div>
    <div id="ripple-layer"></div>

    <!-- Contenido -->
    <div class="content">
      <img src="{% static 'interfaz/Loguito.png' %}" alt="Logo HydroGuard" class="logo">
      <div class="slogan">💧 Protegiendo tu ambiente, gota a gota 💧</div>
      <button class="btn">🚀 INICIAR EXPERIENCIA 🌱</button>

    </div>
  </div>

  <script>
    const rainLayer = document.getElementById('rain-layer');
    const rippleLayer = document.getElementById('ripple-layer');
    const dropsCount = 200;

    for (let i = 0; i < dropsCount; i++) {
      const drop = document.createElement('div');
      drop.classList.add('raindrop');
      const left = (Math.random() * 100) + 'vw';
      const top = (Math.random() * -200 - 20) + 'px';
      const sizeVariation = 0.5 + Math.random() * 0.5;
      const height = 15 * sizeVariation;
      const width = 2 * sizeVariation;
      const duration = (0.7 + Math.random() * 0.6) / sizeVariation + 's';
      const delay = (Math.random() * 3) + 's';

      drop.style.left = left;
      drop.style.top = top;
      drop.style.width = width + 'px';
      drop.style.height = height + 'px';
      drop.style.animationDuration = duration;
      drop.style.animationDelay = delay;

      rainLayer.appendChild(drop);

      setTimeout(() => {
        createRipple(left);
        setInterval(() => createRipple(left), parseFloat(duration) * 1000);
      }, parseFloat(delay) * 1000);
    }

    function createRipple(left) {
      const ripple = document.createElement('div');
      ripple.classList.add('ripple');
      ripple.style.left = left;
      ripple.style.bottom = '150px';
      const rippleLeft = parseFloat(left) + (Math.random() * 10 - 5);
      ripple.style.left = rippleLeft + 'vw';
      rippleLayer.appendChild(ripple);
      setTimeout(() => { ripple.remove(); }, 600);
    }

    document.addEventListener('click', (e) => {
      const clickRipple = document.createElement('div');
      clickRipple.classList.add('ripple');
      clickRipple.style.left = e.clientX + 'px';
      clickRipple.style.top = e.clientY + 'px';
      rippleLayer.appendChild(clickRipple);
      setTimeout(() => { clickRipple.remove(); }, 600);
    });
  </script>
</body>
</html>
